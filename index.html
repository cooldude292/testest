<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lumen — Motion Studio</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%235e6ad2'/><circle cx='16' cy='16' r='7' fill='white'/></svg>">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- ───────────────────────── Top bar ───────────────────────── -->
<header id="topbar">
  <div class="tb-group tb-left">
    <div class="logo">
      <svg width="18" height="18" viewBox="0 0 32 32"><rect width="32" height="32" rx="8" fill="#5e6ad2"/><circle cx="16" cy="16" r="7" fill="#fff"/></svg>
      <span class="logo-name">Lumen</span>
    </div>
    <div class="tb-sep"></div>
    <input id="project-name" class="ghost-input" value="Untitled Project" spellcheck="false">
  </div>

  <div class="tb-group tb-center">
    <button class="icon-btn" id="btn-go-start" title="Go to start (Home)">
      <svg viewBox="0 0 16 16"><path d="M3 2.5v11M13 3.2v9.6c0 .6-.7 1-1.2.6L5.6 8.6a.75.75 0 0 1 0-1.2l6.2-4.8c.5-.4 1.2 0 1.2.6Z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
    </button>
    <button class="icon-btn" id="btn-prev-frame" title="Previous frame (←)">
      <svg viewBox="0 0 16 16"><path d="M10.5 3.2v9.6c0 .6-.7 1-1.2.6L3.1 8.6a.75.75 0 0 1 0-1.2l6.2-4.8c.5-.4 1.2 0 1.2.6Z" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
    </button>
    <button class="icon-btn play" id="btn-play" title="Play / Pause (Space)">
      <svg id="ic-play" viewBox="0 0 16 16"><path d="M4.5 3.1v9.8c0 .62.68 1 1.2.65l7.4-4.9a.78.78 0 0 0 0-1.3l-7.4-4.9a.78.78 0 0 0-1.2.65Z" fill="currentColor"/></svg>
      <svg id="ic-pause" viewBox="0 0 16 16" style="display:none"><rect x="3.5" y="3" width="3.2" height="10" rx="1" fill="currentColor"/><rect x="9.3" y="3" width="3.2" height="10" rx="1" fill="currentColor"/></svg>
    </button>
    <button class="icon-btn" id="btn-next-frame" title="Next frame (→)">
      <svg viewBox="0 0 16 16"><path d="M5.5 3.2v9.6c0 .6.7 1 1.2.6l6.2-4.8a.75.75 0 0 0 0-1.2L6.7 2.6c-.5-.4-1.2 0-1.2.6Z" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
    </button>
    <div class="timecode" id="timecode">0:00:00:00</div>
  </div>

  <div class="tb-group tb-right">
    <button class="icon-btn" id="btn-undo" title="Undo (⌘Z)">
      <svg viewBox="0 0 16 16"><path d="M6.5 3.5 3 7l3.5 3.5M3.5 7H10a3.5 3.5 0 0 1 0 7H8" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button class="icon-btn" id="btn-redo" title="Redo (⇧⌘Z)">
      <svg viewBox="0 0 16 16"><path d="M9.5 3.5 13 7l-3.5 3.5M12.5 7H6a3.5 3.5 0 0 0 0 7h2" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <div class="tb-sep"></div>
    <button class="btn ghost" id="btn-open" title="Open project (⌘O)">Open</button>
    <button class="btn ghost" id="btn-save" title="Save project (⌘S)">Save</button>
    <button class="btn ghost" id="btn-palette" title="Command palette (⌘K)">
      <svg viewBox="0 0 16 16" width="13" height="13" style="margin-right:5px"><path d="M7 2.5 3 8h4l-1 5.5L11 7H7l1-4.5Z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>⌘K
    </button>
    <button class="btn primary" id="btn-export">Export</button>
  </div>
</header>

<!-- ───────────────────────── Main area ───────────────────────── -->
<div id="main">
  <!-- Project / assets panel -->
  <aside id="panel-project" class="panel">
    <div class="panel-head">
      <span class="panel-title">Project</span>
      <button class="icon-btn sm" id="btn-import" title="Import media…">
        <svg viewBox="0 0 16 16"><path d="M8 2.5v8M4.8 7.3 8 10.5l3.2-3.2M3 13.5h10" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>

    <div class="panel-section">
      <div class="section-label">Composition</div>
      <div class="comp-settings" id="comp-settings"></div>
    </div>

    <div class="panel-section grow">
      <div class="section-label">Assets</div>
      <div id="asset-list" class="asset-list">
        <div class="empty-hint">Drop images or video here,<br>or click ↓ to import.</div>
      </div>
    </div>

    <div class="panel-section">
      <div class="section-label">New layer</div>
      <div class="newlayer-grid">
        <button class="btn ghost block" data-newlayer="text">Text</button>
        <button class="btn ghost block" data-newlayer="solid">Solid</button>
        <button class="btn ghost block" data-newlayer="shape">Shape</button>
        <button class="btn ghost block" data-newlayer="null">Adjustment</button>
      </div>
    </div>
  </aside>

  <!-- Viewport -->
  <section id="viewport-wrap">
    <canvas id="viewport"></canvas>
    <div id="viewport-hud">
      <button class="hud-btn" id="btn-zoom-out" title="Zoom out">−</button>
      <span id="zoom-label" title="Click to fit">Fit</span>
      <button class="hud-btn" id="btn-zoom-in" title="Zoom in">+</button>
    </div>
  </section>

  <!-- Properties / inspector -->
  <aside id="panel-props" class="panel">
    <div class="panel-head"><span class="panel-title">Properties</span></div>
    <div id="props-body" class="props-body">
      <div class="empty-hint pad">Select a layer to edit its properties.</div>
    </div>
  </aside>
</div>

<!-- ───────────────────────── Timeline ───────────────────────── -->
<section id="timeline">
  <div class="tl-toolbar">
    <span class="tl-comp-name" id="tl-comp-name">Composition</span>
    <div class="spacer"></div>
    <span class="tl-hint">⌘K for commands · double-click a track to add a keyframe</span>
    <div class="spacer"></div>
    <svg viewBox="0 0 16 16" width="12" height="12" class="dim"><circle cx="7" cy="7" r="4.5" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M10.5 10.5 14 14" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
    <input type="range" id="tl-zoom" min="12" max="420" step="1" value="60" title="Timeline zoom">
    <button class="btn ghost sm" id="tl-fit">Fit</button>
  </div>
  <div class="tl-body" id="tl-body">
    <div class="tl-left" id="tl-left">
      <div class="tl-left-head">
        <span class="dim sm-label">Layers</span>
      </div>
      <div class="tl-left-scroll" id="tl-left-scroll"></div>
    </div>
    <div class="tl-right" id="tl-right">
      <div class="tl-content" id="tl-content">
        <canvas class="tl-ruler" id="tl-ruler" height="28"></canvas>
        <div class="tl-tracks" id="tl-tracks"></div>
        <div class="tl-playhead" id="tl-playhead"><div class="tl-playhead-cap"></div></div>
      </div>
    </div>
  </div>
</section>

<!-- ───────────────────────── Command palette ───────────────────────── -->
<div id="palette-overlay" class="overlay" hidden>
  <div class="palette">
    <input id="palette-input" placeholder="Type a command…" spellcheck="false" autocomplete="off">
    <div id="palette-list" class="palette-list"></div>
  </div>
</div>

<!-- ───────────────────────── Export modal ───────────────────────── -->
<div id="export-overlay" class="overlay" hidden>
  <div class="modal">
    <div class="modal-head">
      <span>Export</span>
      <button class="icon-btn sm" id="export-close" title="Close">
        <svg viewBox="0 0 16 16"><path d="m4 4 8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="modal-body" id="export-body">
      <div class="form-row"><label>Format</label>
        <select id="export-format"><option value="webm">WebM video</option><option value="png">PNG (current frame)</option></select>
      </div>
      <div class="form-row" id="export-quality-row"><label>Quality</label>
        <select id="export-quality"><option value="8000000">High (8 Mbps)</option><option value="16000000">Very high (16 Mbps)</option><option value="4000000">Medium (4 Mbps)</option></select>
      </div>
      <div class="export-progress" id="export-progress" hidden>
        <div class="progress-track"><div class="progress-fill" id="export-progress-fill"></div></div>
        <span id="export-progress-label">Rendering…</span>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn ghost" id="export-cancel">Cancel</button>
      <button class="btn primary" id="export-start">Export</button>
    </div>
  </div>
</div>

<input type="file" id="file-import" accept="image/*,video/*" multiple hidden>
<input type="file" id="file-open" accept=".lumen,application/json" hidden>

<script src="js/core.js"></script>
<script src="js/renderer.js"></script>
<script src="js/timeline.js"></script>
<script src="js/viewport.js"></script>
<script src="js/panels.js"></script>
<script src="js/app.js"></script>
</body>
</html>
